# Supabase CLI configuration. Only the settings the project depends on are set here;
# everything else keeps the CLI defaults.
project_id = "findme"

# Both functions receive requests before a user session exists and authenticate
# the caller themselves (username/password or an authorized email).
[functions.username-login]
verify_jwt = false

[functions.authorized-signup]
verify_jwt = false

# Called only by the database (pg_net) with a shared secret, which the function checks itself.
[functions.send-push]
verify_jwt = false

[auth.email.template.recovery]
subject = "Restablece tu contraseña de Near"
content_path = "./supabase/templates/recovery.html"
