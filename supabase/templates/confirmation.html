<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirma tu correo para Near</title>
</head>
<body style="margin:0;background:#f1f5fb;color:#1f2a44;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5fb;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #dbe4f1;border-radius:20px;">
          <tr>
            <td style="padding:32px;">
              <img src="https://raw.githubusercontent.com/JhonTMich/Near/137aa3343fbb0e4c928c816319935e4d136791a7/app/src/main/ic_launcher-playstore.png" width="48" height="48" alt="" style="display:block;border-radius:12px;">
              <p style="margin:10px 0 24px;color:#244579;font-size:16px;font-weight:bold;">Near</p>
              <h1 style="margin:0 0 16px;color:#1f2a44;font-size:28px;line-height:1.2;">Confirma tu correo</h1>
              <p style="margin:0 0 24px;color:#384764;font-size:16px;line-height:1.55;">Abre este correo en el mismo teléfono donde te registraste. Confirma tu dirección para activar tu cuenta en Near.</p>
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td bgcolor="#244579" style="border-radius:10px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none;">Confirmar mi correo</a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;padding-top:20px;border-top:1px solid #dbe4f1;color:#52627b;font-size:14px;line-height:1.5;">Si no creaste una cuenta en Near, puedes ignorar este correo.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
